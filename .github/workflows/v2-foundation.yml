name: V2 foundation checks

on:
  pull_request:
    paths:
      - 'v2/**'
      - 'PRODUCT.md'
      - 'assets/**'
      - 'scripts/**'
      - '*.html'
      - 'docs/v2/**'
      - '.github/workflows/v2-foundation.yml'
  push:
    branches:
      - v2-development
      - staging
      - main
    paths:
      - 'v2/**'
      - 'PRODUCT.md'
      - 'assets/**'
      - 'scripts/**'
      - '*.html'
      - 'docs/v2/**'
      - '.github/workflows/v2-foundation.yml'

permissions:
  contents: read

concurrency:
  group: v2-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run deploy -- --dry-run --outdir /tmp/racevora-v2-worker-dry-run
