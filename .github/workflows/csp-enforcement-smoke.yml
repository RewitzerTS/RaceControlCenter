name: CSP Enforcement Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read
  checks: read

jobs:
  static-csp-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate enforced policy source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Content-Security-Policy:' _headers
          if grep -Fq 'Content-Security-Policy-Report-Only:' _headers; then
            echo 'CSP is still configured as Report-Only.' >&2
            exit 1
          fi
          grep -Fq "script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com" _headers
          grep -Fq "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com" _headers
          grep -Fq "font-src 'self' data: https://fonts.gstatic.com" _headers
          grep -Fq 'https://kjccstcbqygxuqkvdaqw.supabase.co' _headers
          grep -Fq 'wss://kjccstcbqygxuqkvdaqw.supabase.co' _headers
          grep -Fq "frame-src 'self' https://challenges.cloudflare.com" _headers
          grep -Fq "object-src 'none'" _headers
          grep -Fq "base-uri 'self'" _headers
          grep -Fq "form-action 'self'" _headers
          if grep -Eiq '(service[_-]?role|secret[_-]?key|turnstile[_-]?secret)' _headers; then
            echo 'Secret-like identifier found in public CSP headers.' >&2
            exit 1
          fi

  production-csp-header:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for matching Cloudflare production build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs"
          for attempt in $(seq 1 30); do
            payload="$(curl \
              --fail \
              --silent \
              --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"

            status="$(jq -r '[.check_runs[] | select(.name == "Workers Builds: racevora")][0].status // "missing"' <<< "$payload")"
            conclusion="$(jq -r '[.check_runs[] | select(.name == "Workers Builds: racevora")][0].conclusion // ""' <<< "$payload")"

            echo "Cloudflare build (${attempt}/30): status=${status} conclusion=${conclusion:-pending}"

            if [ "$status" = 'completed' ]; then
              if [ "$conclusion" = 'success' ]; then
                echo 'PASS matching Cloudflare production build'
                exit 0
              fi
              echo "Cloudflare production build completed with ${conclusion:-unknown conclusion}." >&2
              exit 1
            fi

            sleep 10
          done

          echo 'Timed out waiting for the matching Cloudflare production build.' >&2
          exit 1

      - name: Verify production enforced CSP header
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT

          cache_bust="${GITHUB_SHA:-manual}-$(date +%s)"
          for attempt in 1 2 3 4 5 6; do
            echo "Checking RaceVora CSP header (${attempt}/6)"
            : > "$headers"
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --header 'Cache-Control: no-cache' \
              --user-agent 'RaceVora-CSP-Smoke/2.0' \
              --dump-header "$headers" \
              --output /dev/null \
              "https://racevora.com/?csp-check=${cache_bust}-${attempt}"; then
              if grep -Eiq '^content-security-policy:' "$headers" \
                && ! grep -Eiq '^content-security-policy-report-only:' "$headers" \
                && grep -Fq 'https://challenges.cloudflare.com' "$headers" \
                && grep -Fq 'https://cdn.jsdelivr.net' "$headers" \
                && grep -Fq 'https://kjccstcbqygxuqkvdaqw.supabase.co' "$headers"; then
                echo 'PASS production enforced CSP header'
                exit 0
              fi
            fi
            cat "$headers" || true
            sleep 10
          done

          echo 'RaceVora production enforced CSP header is missing or incomplete.' >&2
          exit 1
