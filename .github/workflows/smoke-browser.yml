name: Browser Smoke Test

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/rcc-http.log 2>&1 &
          echo $! > /tmp/rcc-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/admin.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rcc-http.log
          exit 1

      - name: Run smoke checks
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          const classifyUrl = (url) => {
            try {
              const parsed = new URL(url);
              if (parsed.hostname === '127.0.0.1') return 'local';
              if (parsed.hostname.endsWith('.supabase.co')) return 'supabase';
              if (parsed.hostname === 'cdn.jsdelivr.net') return 'critical-external';
              return 'optional-external';
            } catch {
              return 'unknown';
            }
          };

          const assertLanding = async (page, testCase) => {
            await page.waitForSelector('.cinematic-story', { timeout: 15000 });
            await page.waitForSelector('.command-shell', { timeout: 15000 });
            await page.waitForSelector('#workflow', { timeout: 15000 });

            const layout = await page.evaluate(() => ({
              revision: document.body.dataset.landingRevision || '',
              innerWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              htmlOverflowX: getComputedStyle(document.documentElement).overflowX,
              bodyOverflowX: getComputedStyle(document.body).overflowX,
              loginButtons: document.querySelectorAll('[data-login-open]').length,
              visibleLoginButtons: [...document.querySelectorAll('[data-login-open]')].filter(el => !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length)).length,
              registerLinks: document.querySelectorAll('a[href="register.html"]').length,
              cinematicCanvas: Boolean(document.querySelector('.cinematic-story canvas')),
              mobileMaster: document.querySelector('.mobile-master source')?.getAttribute('src') || '',
              gradientHeadlines: document.querySelectorAll('.gradient-text').length,
              legacyLandingStyles: [...document.styleSheets].some(sheet => String(sheet.href || '').includes('landing3'))
            }));

            const xOverflowClipped = ['hidden', 'clip'].includes(layout.htmlOverflowX) || ['hidden', 'clip'].includes(layout.bodyOverflowX);
            if (layout.scrollWidth > layout.innerWidth + 2 && !xOverflowClipped) {
              throw new Error(`${testCase.name}: visible horizontal overflow ${layout.scrollWidth}px > ${layout.innerWidth}px`);
            }
            if (layout.revision !== 'cinematic-v2-2026-08-19') throw new Error(`${testCase.name}: unexpected landing revision ${layout.revision}`);
            if (layout.loginButtons < 1 || layout.visibleLoginButtons < 1) throw new Error(`${testCase.name}: visible login CTA missing`);
            if (layout.registerLinks < 2) throw new Error(`${testCase.name}: registration CTA missing`);
            if (!layout.cinematicCanvas || !layout.mobileMaster.includes('racevora-master-mobile.mp4')) throw new Error(`${testCase.name}: cinematic media missing`);
            if (layout.gradientHeadlines < 4) throw new Error(`${testCase.name}: expected gradient product headlines, got ${layout.gradientHeadlines}`);
            if (layout.legacyLandingStyles) throw new Error(`${testCase.name}: legacy landing3 stylesheet is still loaded`);

            await page.locator('[data-login-open]:visible').first().click();
            await page.waitForSelector('#landing-login-modal:not([hidden])', { timeout: 5000 });
            await page.locator('[data-login-close]').last().click();
            await page.waitForFunction(() => document.querySelector('#landing-login-modal')?.hidden === true, { timeout: 5000 });

            await page.locator('#workflow').scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
          };

          const assertUnifiedAdminLogin = async (page, testCase) => {
            await page.waitForURL((url) => url.pathname.endsWith('/index.html') && url.searchParams.get('login') === '1', { timeout: 15000 });
            await page.waitForSelector('#landing-login-modal:not([hidden])', { timeout: 15000 });
            await page.waitForSelector('#landing-login-form', { timeout: 15000 });

            const state = await page.evaluate(() => {
              const params = new URLSearchParams(window.location.search);
              return {
                login: params.get('login'),
                next: params.get('next'),
                legacyAdminForm: Boolean(document.querySelector('#admin-login-form')),
                legacyAdminPassword: Boolean(document.querySelector('#admin-password')),
                landingPassword: Boolean(document.querySelector('#landing-login-password')),
                modalVisible: Boolean(document.querySelector('#landing-login-modal:not([hidden])'))
              };
            });

            if (state.login !== '1') throw new Error(`${testCase.name}: central login flag missing`);
            if (state.next !== testCase.expectedNext) throw new Error(`${testCase.name}: expected next=${testCase.expectedNext}, got ${state.next}`);
            if (state.legacyAdminForm) throw new Error(`${testCase.name}: legacy admin login form still exists`);
            if (state.legacyAdminPassword) throw new Error(`${testCase.name}: legacy admin password field still exists`);
            if (!state.landingPassword) throw new Error(`${testCase.name}: central RaceVora password field missing`);
            if (!state.modalVisible) throw new Error(`${testCase.name}: central login modal did not open automatically`);
          };

          const assertNavigation = async (page, testCase) => {
            await page.waitForSelector('#site-header .main-nav', { timeout: 15000 });
            await page.waitForFunction(() => document.querySelector('.brand')?.dataset?.directNavigation === 'true', { timeout: 5000 });

            const state = await page.evaluate(() => {
              const admin = document.querySelector('[data-admin-nav-link]');
              const labels = [...document.querySelectorAll('.main-nav a .nav-label')];
              return {
                svgIcons: document.querySelectorAll('.main-nav svg.nav-icon').length,
                pngIcons: document.querySelectorAll('.main-nav img.nav-icon').length,
                hamburgerSvg: Boolean(document.querySelector('.mobile-toggle svg.mobile-toggle__svg')),
                adminHidden: !admin || admin.hidden || getComputedStyle(admin).display === 'none',
                directBrandNavigation: document.querySelector('.brand')?.dataset?.directNavigation === 'true',
                labelBackgrounds: labels.map((label) => getComputedStyle(label).backgroundColor)
              };
            });

            if (state.svgIcons < 8) throw new Error(`${testCase.name}: expected SVG navigation icons, got ${state.svgIcons}`);
            if (state.pngIcons !== 0) throw new Error(`${testCase.name}: legacy PNG navigation icons remain`);
            if (!state.hamburgerSvg) throw new Error(`${testCase.name}: hamburger SVG missing`);
            if (!state.adminHidden) throw new Error(`${testCase.name}: anonymous user can see Admin navigation`);
            if (!state.directBrandNavigation) throw new Error(`${testCase.name}: legacy logo shortcut was not removed`);

            if (testCase.mobileNavigation) {
              await page.evaluate(() => {
                const overlay = document.querySelector('#season-champion-overlay');
                if (overlay) {
                  overlay.classList.remove('is-visible');
                  overlay.setAttribute('hidden', '');
                  overlay.style.pointerEvents = 'none';
                }
                document.querySelector('[data-nav-toggle]')?.click();
              });
              await page.waitForFunction(() => document.querySelector('[data-main-nav]')?.classList.contains('open'), { timeout: 5000 });
              const mobile = await page.evaluate(() => {
                const visibleLinks = [...document.querySelectorAll('.main-nav > a:not([hidden])')];
                return visibleLinks.map((link) => {
                  const label = link.querySelector('.nav-label');
                  const icon = link.querySelector('.nav-icon');
                  return {
                    linkDisplay: getComputedStyle(link).display,
                    labelBackground: label ? getComputedStyle(label).backgroundColor : '',
                    iconDisplay: icon ? getComputedStyle(icon).display : 'none'
                  };
                });
              });
              if (!mobile.length) throw new Error(`${testCase.name}: mobile navigation has no visible links`);
              if (mobile.some((item) => item.iconDisplay === 'none')) throw new Error(`${testCase.name}: mobile SVG icon hidden`);
              if (mobile.some((item) => !['rgba(0, 0, 0, 0)', 'transparent'].includes(item.labelBackground))) {
                throw new Error(`${testCase.name}: mobile label still has an independent background`);
              }
            }
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'public-rcc-home', url: 'http://127.0.0.1:8080/index.html?league=rcc', selector: 'body' },
              { name: 'race-hub-navigation-desktop', url: 'http://127.0.0.1:8080/race-hub.html?league=rcc', selector: 'body', navigation: true },
              { name: 'race-hub-navigation-iphone', url: 'http://127.0.0.1:8080/race-hub.html?league=rcc', selector: 'body', viewport: { width: 393, height: 852 }, navigation: true, mobileNavigation: true },
              { name: 'rcc-admin-unified-login', url: 'http://127.0.0.1:8080/admin.html?league=rcc', selector: '#landing-login-form', unifiedAdminLogin: true, expectedNext: 'admin.html?league=rcc' },
              { name: 'private-league-admin-unified-login', url: 'http://127.0.0.1:8080/admin.html?league=rcc-test', selector: '#landing-login-form', unifiedAdminLogin: true, expectedNext: 'admin.html?league=rcc-test' },
              { name: 'invite-password-page', url: 'http://127.0.0.1:8080/set-password.html?league=rcc-test', selector: '#password-setup-status' },
              { name: 'landing-desktop', url: 'http://127.0.0.1:8080/index.html', selector: '.cinematic-story', viewport: { width: 1440, height: 1000 }, landing: true },
              { name: 'landing-iphone', url: 'http://127.0.0.1:8080/index.html', selector: '.cinematic-story', viewport: { width: 393, height: 852 }, landing: true }
            ];

            for (const testCase of cases) {
              const page = await browser.newPage({ viewport: testCase.viewport || { width: 1280, height: 800 } });
              const fatalErrors = [];
              const diagnostics = [];

              page.on('pageerror', (error) => fatalErrors.push(`pageerror: ${error.message}`));
              page.on('requestfailed', (request) => {
                const errorText = request.failure()?.errorText || 'unknown';
                const url = request.url();
                const kind = classifyUrl(url);
                const detail = `requestfailed: ${errorText} ${url}`;
                diagnostics.push(detail);
                if (kind === 'supabase' && errorText !== 'net::ERR_ABORTED') fatalErrors.push(detail);
                if ((kind === 'local' && errorText !== 'net::ERR_ABORTED') || kind === 'critical-external' || kind === 'unknown') fatalErrors.push(detail);
              });
              page.on('response', (response) => {
                if (response.status() < 400) return;
                const url = response.url();
                const kind = classifyUrl(url);
                const detail = `response: HTTP ${response.status()} ${url}`;
                diagnostics.push(detail);
                if (kind === 'local' || kind === 'supabase' || kind === 'critical-external' || kind === 'unknown') fatalErrors.push(detail);
              });
              page.on('console', (message) => {
                if (message.type() === 'error') diagnostics.push(`console: ${message.text()}`);
              });

              const response = await page.goto(testCase.url, { waitUntil: 'domcontentloaded', timeout: 30000 });
              if (!response || response.status() >= 400) throw new Error(`${testCase.name}: HTTP ${response?.status()}`);
              await page.waitForSelector(testCase.selector, { timeout: 15000 });
              await page.waitForTimeout(2500);
              if (testCase.navigation) await assertNavigation(page, testCase);
              if (testCase.landing) await assertLanding(page, testCase);
              if (testCase.unifiedAdminLogin) await assertUnifiedAdminLogin(page, testCase);

              diagnostics.forEach((line) => console.log(`[${testCase.name}] ${line}`));
              if (fatalErrors.length) throw new Error(`${testCase.name}: ${fatalErrors.join(' | ')}`);
              console.log(`PASS ${testCase.name}`);
              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            const message = String(error?.message || error || 'Unknown browser smoke failure').replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            console.error(error);
            console.error(`::error title=Browser smoke failed::${message}`);
            process.exit(1);
          });
          NODE
