name: Email Delivery State

on:
  pull_request:
    paths:
      - 'assets/js/email-pause.js'
      - 'assets/js/auth-turnstile-config.js'
      - 'supabase/functions/finalize-consumer-registration/index.ts'
      - 'supabase/functions/manage-league-member/index.ts'
      - 'supabase/functions/submit-consumer-withdrawal/index.ts'
      - '.github/workflows/email-pause-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/email-pause.js'
      - 'assets/js/auth-turnstile-config.js'
      - 'supabase/functions/finalize-consumer-registration/index.ts'
      - 'supabase/functions/manage-league-member/index.ts'
      - 'supabase/functions/submit-consumer-withdrawal/index.ts'
      - '.github/workflows/email-pause-smoke.yml'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify transactional email flows are active without sending mail
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/email-pause.js
          grep -Fq 'window.RACEVORA_EMAIL_SENDING_PAUSED = false' assets/js/auth-turnstile-config.js
          grep -Fq 'RACEVORA_EMAIL_SENDING_PAUSED !== true' assets/js/email-pause.js
          grep -Fq 'create_league' supabase/functions/finalize-consumer-registration/index.ts
          grep -Fq 'contract_confirmations' supabase/functions/finalize-consumer-registration/index.ts
          grep -Fq 'sendResendEmail' supabase/functions/finalize-consumer-registration/index.ts
          grep -Fq 'inviteUserByEmail' supabase/functions/manage-league-member/index.ts
          grep -Fq 'api.resend.com/emails' supabase/functions/submit-consumer-withdrawal/index.ts
          if grep -Fq 'email_sending_paused' \
            supabase/functions/finalize-consumer-registration/index.ts \
            supabase/functions/manage-league-member/index.ts \
            supabase/functions/submit-consumer-withdrawal/index.ts; then
            echo 'An active transactional function still contains the pause response.' >&2
            exit 1
          fi
          echo 'PASS transactional email paths active; workflow performs static checks only.'
