name: Result Version History Smoke

on:
  pull_request:
    paths:
      - 'assets/js/components/rcc-result-version-history.js'
      - 'assets/css/components/rcc-result-version-history.css'
      - 'assets/js/components/rcc-result-draft.js'
      - '.github/workflows/result-version-history-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/components/rcc-result-version-history.js'
      - 'assets/css/components/rcc-result-version-history.css'
      - 'assets/js/components/rcc-result-draft.js'
      - '.github/workflows/result-version-history-smoke.yml'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate version history assets
        run: |
          node --check assets/js/components/rcc-result-version-history.js
          node --check assets/js/components/rcc-result-draft.js
          grep -Fq "RCCResultVersionHistory" assets/js/components/rcc-result-draft.js
          grep -Fq ".eq('status', 'published')" assets/js/components/rcc-result-version-history.js
          grep -Fq "Read-only Historie" assets/js/components/rcc-result-version-history.js
          if grep -Eq "\.(insert|update|delete)\(" assets/js/components/rcc-result-version-history.js; then
            echo 'Version history must remain read-only.' >&2
            exit 1
          fi

  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/racevora-version-history-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/assets/js/components/rcc-result-version-history.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/racevora-version-history-server.log
          exit 1
      - name: Exercise read-only version comparison on mobile
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 393, height: 852 } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.setContent(`
              <!doctype html><html><head></head><body data-page="admin">
                <div class="panel"><div id="publish-workflow-list"></div></div>
                <script>
                  window.escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
                  window.__historyWrites = 0;
                  const imports = [
                    {
                      id:'published-2', race_id:'race-1', source_filename:'Korrektur · Mexico GP', published_at:'2026-08-18T10:00:00Z', updated_at:'2026-08-18T10:00:00Z',
                      races:{ grand_prix_name:'Mexico GP', round_number:7, season_id:'season-1' },
                      race_result_import_rows:[
                        {driver_id:'driver-1',driver_name_raw:'Alpha',finish_position:1,grid_position:2,pit_stops:1,fastest_lap_time:'01:20,000',race_time:'40:00,000',participation_status:'PLAYER',raw_payload:{source:'correction'}},
                        {driver_id:'driver-2',driver_name_raw:'Bravo',finish_position:2,grid_position:1,pit_stops:1,fastest_lap_time:'01:20,500',race_time:'+00:05,000',participation_status:'PLAYER',raw_payload:{source:'correction'}},
                        {driver_id:'driver-3',driver_name_raw:'Charlie',finish_position:3,grid_position:3,pit_stops:1,fastest_lap_time:'01:21,000',race_time:'+00:10,000',participation_status:'PLAYER',raw_payload:{source:'correction'}}
                      ]
                    },
                    {
                      id:'published-1', race_id:'race-1', source_filename:'Mexico.csv', published_at:'2026-08-01T10:00:00Z', updated_at:'2026-08-01T10:00:00Z',
                      races:{ grand_prix_name:'Mexico GP', round_number:7, season_id:'season-1' },
                      race_result_import_rows:[
                        {driver_id:'driver-1',driver_name_raw:'Alpha',finish_position:2,grid_position:1,pit_stops:1,fastest_lap_time:'01:21,000',race_time:'+00:05,000',participation_status:'PLAYER',raw_payload:{source:'csv'}},
                        {driver_id:'driver-2',driver_name_raw:'Bravo',finish_position:1,grid_position:2,pit_stops:1,fastest_lap_time:'01:20,500',race_time:'40:00,000',participation_status:'PLAYER',raw_payload:{source:'csv'}}
                      ]
                    }
                  ];
                  window.supabaseClient = {
                    from(table) {
                      if (table !== 'race_result_imports') throw new Error('Unexpected table: ' + table);
                      const response = {data:imports,error:null};
                      const builder = {
                        select(){return builder},
                        eq(field,value){if(field !== 'status' || value !== 'published') throw new Error('History query must be published-only'); return builder},
                        order(){return builder}, limit(){return builder},
                        insert(){window.__historyWrites += 1; return builder},
                        update(){window.__historyWrites += 1; return builder},
                        delete(){window.__historyWrites += 1; return builder},
                        then(resolve,reject){return Promise.resolve(response).then(resolve,reject)}
                      };
                      return builder;
                    }
                  };
                <\/script>
              </body></html>`);
            await page.addScriptTag({ url: 'http://127.0.0.1:4173/assets/js/components/rcc-result-version-history.js' });
            await page.waitForSelector('#rcc-result-version-history [data-history-race="race-1"]');
            const race = page.locator('[data-history-race="race-1"]');
            const summaryText = await race.locator('summary').innerText();
            if (!summaryText.includes('2 Versionen')) throw new Error('Version count missing: ' + summaryText);
            await race.locator('summary').click();
            const historyText = await race.innerText();
            if (!historyText.includes('Version 2 · Live')) throw new Error('Live version marker missing');
            if (!historyText.includes('2 geändert · 1 hinzugefügt · 0 entfernt')) throw new Error('Version diff summary missing: ' + historyText);
            if (!historyText.includes('Alpha · Position: 2 → 1')) throw new Error('Driver change detail missing: ' + historyText);
            if (!historyText.includes('Charlie · hinzugefügt')) throw new Error('Added driver detail missing: ' + historyText);
            const writes = await page.evaluate(() => window.__historyWrites);
            if (writes !== 0) throw new Error('Version history attempted a write');
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            if (overflow > 2) throw new Error(`Visible mobile overflow: ${overflow}px`);
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
