name: Landing Page Cleanup Guard

on:
  pull_request:
    paths:
      - 'index.html'
      - 'landing.html'
      - 'landing2.html'
      - 'landing3.html'
      - 'test-landing.html'
      - 'Test2-Landing.html'
      - '.github/workflows/test2-landing-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing-page-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Keep index as the only landing page
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html

          for legacy in \
            landing.html \
            landing2.html \
            landing3.html \
            test-landing.html \
            Test2-Landing.html; do
            if [[ -e "$legacy" ]]; then
              echo "Extra landing page must not exist: $legacy" >&2
              exit 1
            fi
          done

          echo 'PASS index.html is the only landing page'
