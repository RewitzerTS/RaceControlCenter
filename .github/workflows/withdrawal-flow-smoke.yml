name: Electronic Withdrawal Flow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  withdrawal-flow-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify withdrawal storage and confirmation email path statically
        shell: bash
        run: |
          set -euo pipefail
          function='supabase/functions/submit-consumer-withdrawal/index.ts'
          test -s database/2026-consumer-withdrawals.sql
          test -s "$function"
          grep -Fq 'consumer_withdrawals' database/2026-consumer-withdrawals.sql
          grep -Fq 'revoke all on table public.consumer_withdrawals from public, anon, authenticated' database/2026-consumer-withdrawals.sql
          grep -Fq '.from("consumer_withdrawals")' "$function"
          grep -Fq 'RESEND_API_KEY' "$function"
          grep -Fq 'https://api.resend.com/emails' "$function"
          grep -Fq 'sendResendEmail' "$function"
          grep -Fq 'confirmation_sent: confirmationSent' "$function"
          if grep -Fq 'email_sending_paused' "$function"; then
            echo 'Withdrawal confirmation email path is still paused.' >&2
            exit 1
          fi
          grep -Fq 'Widerruf bestätigen' widerruf.html
          grep -Fq 'withdrawal-form' widerruf.html
          grep -Fq 'submit-consumer-withdrawal' assets/js/pages/withdrawal.js
          grep -Fq 'Eingangsbeleg herunterladen' widerruf.html
          grep -Fq 'Resend' datenschutz.html
          echo 'PASS active withdrawal email path verified statically; no withdrawal or email created by CI.'

      - name: Syntax check browser script
        run: node --check assets/js/pages/withdrawal.js

      - name: Verify public withdrawal entry remains prominent
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<strong>Vertrag widerrufen</strong>' components/footer.html
          grep -Fq 'href="widerruf.html"' index.html
          grep -Fq 'href="widerruf.html"' register.html

      - name: Verify two-step labels and downloadable receipt remain available
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '>Widerruf prüfen<' widerruf.html
          grep -Fq '>Widerruf bestätigen<' widerruf.html
          grep -Fq 'confirmed: true' assets/js/pages/withdrawal.js
          grep -Fq 'downloadReceipt' assets/js/pages/withdrawal.js
