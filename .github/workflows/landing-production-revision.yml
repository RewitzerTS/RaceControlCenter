name: Landing Production Revision

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

jobs:
  verify-live-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check current landing revision is live
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 \
            --user-agent 'RaceVora-Landing-Revision/1.0' \
            --output "$body" 'https://racevora.com/'
          expected="$(grep -oE 'data-landing-revision="[^"]+"' index.html | head -n 1)"
          if [ -z "$expected" ] || ! grep -Fq "$expected" "$body"; then
            echo 'Production is not serving the current RaceVora landing revision.' >&2
            sed -n '1,30p' "$body" >&2
            exit 1
          fi
          echo 'PASS current landing revision is live'
