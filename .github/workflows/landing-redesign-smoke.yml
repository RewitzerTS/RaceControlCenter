name: Landing Redesign Smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'landing.html'
      - 'landing2.html'
      - 'landing3.html'
      - 'test-landing.html'
      - 'Test2-Landing.html'
      - 'test-landing/index.html'
      - 'test-landing/style.css'
      - 'test-landing/script.js'
      - 'assets/js/pages/landing.js'
      - '.github/workflows/landing-redesign-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing-redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current landing architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          grep -Fq 'data-landing-revision="cinematic-v2-2026-08-19"' index.html
          grep -Fq 'test-landing/style.css' index.html
          grep -Fq 'test-landing/script.js' index.html
          grep -Fq 'YOUR LEAGUE.' index.html
          grep -Fq 'KI-Bildimport' index.html
          grep -Fq 'Stewarding' index.html
          grep -Fq 'Multi-Liga' index.html
          grep -Fq 'racevora-master-mobile.mp4' index.html
          grep -Fq 'background-clip:text' test-landing/style.css
          grep -Fq -- '--brand-gradient' test-landing/style.css
          grep -Fq 'linear-gradient(135deg,#1b0b36' test-landing/style.css
          test "$(find test-landing/frames -maxdepth 1 -name 'frame-*.webp' | wc -l)" -eq 90

          for legacy in \
            assets/css/pages/landing.css \
            assets/css/pages/landing2.css \
            assets/css/pages/landing-brand-fix.css \
            assets/css/pages/landing3.css \
            assets/css/pages/landing3-impeccable.css \
            assets/css/pages/landing3-login.css \
            assets/css/pages/landing3-motion.css \
            assets/css/pages/landing3-previews.css \
            assets/css/pages/landing3-product-snapshots.css \
            assets/js/pages/landing-3d.js \
            assets/js/pages/landing3-motion.js; do
            if [[ -e "$legacy" ]]; then
              echo "Legacy landing asset still present: $legacy" >&2
              exit 1
            fi
          done

          node --check assets/js/pages/landing.js
          node --check test-landing/script.js
