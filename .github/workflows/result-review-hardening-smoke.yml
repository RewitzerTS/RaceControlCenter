name: Result Review Hardening Smoke

on:
  pull_request:
    paths:
      - 'assets/js/components/rcc-result-review-hardening.js'
      - 'assets/css/components/rcc-result-review-hardening.css'
      - 'assets/js/components/rcc-results-workflow.js'
      - '.github/workflows/result-review-hardening-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/components/rcc-result-review-hardening.js'
      - 'assets/css/components/rcc-result-review-hardening.css'
      - 'assets/js/components/rcc-results-workflow.js'
      - '.github/workflows/result-review-hardening-smoke.yml'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate hardening wiring
        run: |
          node --check assets/js/components/rcc-result-review-hardening.js
          node --check assets/js/components/rcc-results-workflow.js
          grep -Fq 'RCCResultReviewHardening' assets/js/components/rcc-results-workflow.js
          grep -Fq 'rcc-result-review-hardening.js' assets/js/components/rcc-results-workflow.js
          grep -Fq "source: 'csv'" assets/js/components/rcc-result-review-hardening.js
          grep -Fq 'Blocker beheben' assets/js/components/rcc-result-review-hardening.js
          grep -Fq 'Was wird jetzt veröffentlicht?' assets/js/components/rcc-result-review-hardening.js
          grep -Fq 'Steward-Auswirkung:' assets/js/components/rcc-result-review-hardening.js

  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/review-hardening-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/assets/js/components/rcc-result-review-hardening.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/review-hardening-http.log
          exit 1
      - name: Exercise provenance, blockers and final summary
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 393, height: 852 } });
            await page.setContent(`<!doctype html><html><head></head><body>
              <div id="publish-feedback"></div>
              <article class="rcc-result-review__card" data-result-review-import="import-ready">
                <div class="rcc-result-review__title-wrap"><span class="rcc-result-review__source"><b>?</b>Import</span><p>Spain.csv · gespeichert 18.08.2026</p></div>
                <details class="rcc-result-review__preview"><summary>Ergebnisvorschau</summary></details>
              </article>
              <article class="rcc-result-review__card" data-result-review-import="import-blocked">
                <div class="rcc-result-review__title-wrap"><span class="rcc-result-review__source"><b>?</b>Import</span><p>Manuelle Eingabe · gespeichert 18.08.2026</p></div>
                <details class="rcc-result-review__preview"><summary>Ergebnisvorschau</summary></details>
              </article>
              <div id="publish-workflow-list">
                <button class="publish-results-btn" data-import-id="import-ready" data-race-id="race-ready">Ergebnis veröffentlichen</button>
                <button class="publish-results-btn" data-import-id="import-blocked" data-race-id="race-blocked">Ergebnis veröffentlichen</button>
              </div>
              <input id="csv-file" type="file">
              <button id="import-results-btn">CSV importieren</button>
            </body></html>`);
            await page.evaluate(() => {
              const imports = [
                {
                  id:'import-ready',race_id:'race-ready',status:'under_review',source_filename:'Spain.csv',imported_at:'2026-08-18T08:00:00Z',races:{grand_prix_name:'Spain GP',round_number:5},
                  race_result_import_rows:[
                    {driver_id:'d1',finish_position:1,grid_position:1,pit_stops:1,fastest_lap_time:'01:20,000',race_time:'40:00,000',participation_status:'PLAYER',raw_payload:{source:'csv'}},
                    {driver_id:'d2',finish_position:2,grid_position:2,pit_stops:1,fastest_lap_time:'01:21,000',race_time:'+00:03,000',participation_status:'BOT',raw_payload:{source:'csv'}}
                  ]
                },
                {
                  id:'import-blocked',race_id:'race-blocked',status:'under_review',source_filename:'Manuelle Eingabe',imported_at:'2026-08-18T08:00:00Z',races:{grand_prix_name:'Monaco GP',round_number:6},
                  race_result_import_rows:[
                    {driver_id:'same',finish_position:1,grid_position:1,pit_stops:1,fastest_lap_time:'01:10,000',race_time:'42:00,000',participation_status:'PLAYER',raw_payload:{source:'manual'}},
                    {driver_id:'same',finish_position:1,grid_position:2,pit_stops:1,fastest_lap_time:'01:11,000',race_time:'+00:02,000',participation_status:'PLAYER',raw_payload:{source:'manual'}}
                  ]
                }
              ];
              const penalties = [{race_id:'race-ready',driver_id:'d2',time_delta_ms:5000,points_delta:0,reason:'Unsafe rejoin · +5 Sekunden'}];
              window.escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, '');
              window.showFeedback = () => {};
              window.confirmDangerousAction = async () => true;
              window.RCCResultRelease = { finalPublish: async () => true };
              window.supabaseClient = {
                from(table) {
                  const chain = {
                    select(){ return chain; }, in(){ return chain; }, order(){ return chain; },
                    insert(payload){ chain.lastInsert = payload; return chain; },
                    update(payload){ chain.lastUpdate = payload; return chain; },
                    then(resolve, reject){
                      const data = table === 'race_result_imports' ? imports : table === 'race_penalties' ? penalties : [];
                      return Promise.resolve({data,error:null}).then(resolve,reject);
                    }
                  };
                  return chain;
                }
              };
            });
            await page.addScriptTag({ url:'http://127.0.0.1:8080/assets/js/components/rcc-result-review-hardening.js' });
            await page.evaluate(() => window.RCCResultReviewHardening.init());
            await page.waitForFunction(() => document.querySelector('[data-result-review-import="import-ready"] .rcc-result-review__source')?.textContent.includes('CSV'));
            const result = await page.evaluate(() => {
              const ready = document.querySelector('.publish-results-btn[data-import-id="import-ready"]');
              const blocked = document.querySelector('.publish-results-btn[data-import-id="import-blocked"]');
              const steward = document.querySelector('[data-result-review-import="import-ready"] .rcc-result-review__steward-impact')?.textContent || '';
              const source = document.querySelector('[data-result-review-import="import-ready"] .rcc-result-review__source')?.textContent || '';
              const badAi = window.RCCResultReviewHardening.explicitSource({source_filename:'Spain.csv',race_result_import_rows:[]});
              const summary = window.RCCResultReviewHardening.finalSummaryText({source:{label:'CSV'},rowCount:2,botCount:1,penaltyCount:1,totalPenaltyMs:5000,warnings:[]});
              return {source,badAi,readyDisabled:ready.disabled,blockedDisabled:blocked.disabled,blockedText:blocked.textContent,steward,summary,scrollWidth:document.documentElement.scrollWidth,width:innerWidth};
            });
            if (!result.source.includes('CSV') || result.badAi.key !== 'csv') throw new Error(`provenance failed ${JSON.stringify(result)}`);
            if (result.readyDisabled || !result.blockedDisabled || !result.blockedText.includes('Blocker')) throw new Error(`publish guard failed ${JSON.stringify(result)}`);
            if (!result.steward.includes('+5') || !result.summary.includes('Was wird jetzt veröffentlicht?')) throw new Error(`summary/steward failed ${JSON.stringify(result)}`);
            if (result.scrollWidth > result.width + 2) throw new Error(`mobile overflow ${JSON.stringify(result)}`);
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
