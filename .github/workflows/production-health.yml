name: Production Health

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: production-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  racevora-production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check critical RaceVora routes
        shell: bash
        run: |
          set -euo pipefail

          check_route() {
            local name="$1"
            local url="$2"
            local marker="$3"
            local body
            local headers
            local attempt

            body="$(mktemp)"
            headers="$(mktemp)"

            for attempt in 1 2 3; do
              echo "Checking ${name} (${attempt}/3): ${url}"
              if curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --connect-timeout 10 \
                --max-time 20 \
                --retry 0 \
                --user-agent 'RaceVora-Production-Health/1.1' \
                --dump-header "$headers" \
                --output "$body" \
                "$url"; then
                if grep -Fq "$marker" "$body"; then
                  echo "PASS ${name}"
                  rm -f "$body" "$headers"
                  return 0
                fi
                echo "Expected marker not found: ${marker}" >&2
              fi
              sleep $((attempt * 3))
            done

            echo "FAIL ${name}: ${url}" >&2
            echo '--- response headers ---' >&2
            cat "$headers" >&2 || true
            echo '--- first 40 response lines ---' >&2
            sed -n '1,40p' "$body" >&2 || true
            rm -f "$body" "$headers"
            return 1
          }

          check_edge_options() {
            local name="$1"
            local url="$2"
            local body
            local status
            local attempt

            body="$(mktemp)"
            for attempt in 1 2 3; do
              echo "Checking ${name} (${attempt}/3): ${url}"
              status="$(curl \
                --silent \
                --show-error \
                --connect-timeout 10 \
                --max-time 20 \
                --output "$body" \
                --write-out '%{http_code}' \
                --request OPTIONS \
                --header 'Origin: https://racevora.com' \
                --header 'Access-Control-Request-Method: POST' \
                --user-agent 'RaceVora-Production-Health/1.1' \
                "$url" || true)"

              if [ "$status" = '200' ] && grep -Fq 'ok' "$body"; then
                echo "PASS ${name}"
                rm -f "$body"
                return 0
              fi

              echo "Unexpected ${name} response: HTTP ${status}" >&2
              cat "$body" >&2 || true
              sleep $((attempt * 3))
            done

            rm -f "$body"
            return 1
          }

          check_route 'Landing' 'https://racevora.com/' 'RaceVora'
          check_route 'Registration' 'https://racevora.com/register.html' 'league-registration-form'
          check_route 'Password recovery' 'https://racevora.com/forgot-password.html' 'RaceVora'
          check_route 'Password setup' 'https://racevora.com/set-password.html' 'password-setup-status'
          check_route 'Imprint' 'https://racevora.com/impressum.html' 'Richard Rewitzer'
          check_route 'Privacy policy' 'https://racevora.com/datenschutz.html' 'Datenschutzerklärung'
          check_route 'Terms' 'https://racevora.com/agb.html' 'Allgemeine Geschäftsbedingungen'
          check_route 'Electronic withdrawal' 'https://racevora.com/widerruf.html' 'Widerruf bestätigen'
          check_route 'Public RCC Race Hub' 'https://racevora.com/race-hub.html?league=rcc' 'site-header'
          check_edge_options 'Withdrawal Edge Function' 'https://kjccstcbqygxuqkvdaqw.supabase.co/functions/v1/submit-consumer-withdrawal'

      - name: Health summary
        if: success()
        run: |
          echo '### RaceVora production health ✅' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Landing' >> "$GITHUB_STEP_SUMMARY"
          echo '- Registration' >> "$GITHUB_STEP_SUMMARY"
          echo '- Password recovery' >> "$GITHUB_STEP_SUMMARY"
          echo '- Password setup' >> "$GITHUB_STEP_SUMMARY"
          echo '- Impressum / Datenschutz / AGB' >> "$GITHUB_STEP_SUMMARY"
          echo '- Electronic withdrawal page' >> "$GITHUB_STEP_SUMMARY"
          echo '- Withdrawal Edge Function (non-mutating OPTIONS check)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Public RCC Race Hub (read-only)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'All critical public routes and the non-mutating withdrawal endpoint check responded successfully.' >> "$GITHUB_STEP_SUMMARY"
