name: Contract Confirmation Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-confirmation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify active registration and contract confirmation path statically
        shell: bash
        run: |
          set -euo pipefail
          migration='database/2026-consumer-contract-confirmations.sql'
          function='supabase/functions/finalize-consumer-registration/index.ts'
          config='assets/js/auth-turnstile-config.js'
          register_client='assets/js/pages/register.js'
          setup_client='assets/js/pages/account-setup.js'

          test -s "$migration"
          test -s "$function"
          grep -Fq 'window.RACEVORA_EMAIL_SENDING_PAUSED = false' "$config"
          grep -Fq 'authHeader.startsWith("Bearer ")' "$function"
          grep -Fq 'userClient.auth.getUser()' "$function"
          grep -Fq 'create_league' "$function"
          grep -Fq 'contract_confirmations' "$function"
          grep -Fq 'sendResendEmail' "$function"
          grep -Fq 'https://api.resend.com/emails' "$function"
          grep -Fq 'finalize-consumer-registration' "$register_client"
          grep -Fq 'finalize-consumer-registration' "$setup_client"
          if grep -Fq 'email_sending_paused' "$function"; then
            echo 'Registration finalizer is still paused.' >&2
            exit 1
          fi
          echo 'PASS active contract confirmation path verified statically; no email sent by CI.'
