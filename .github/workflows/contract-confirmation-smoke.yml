name: Contract Confirmation Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-confirmation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify durable-medium registration flow
        shell: bash
        run: |
          set -euo pipefail
          migration='database/2026-consumer-contract-confirmations.sql'
          function='supabase/functions/finalize-consumer-registration/index.ts'
          client='assets/js/pages/register.js'
          test -s "$migration"
          test -s "$function"
          test -s "$client"
          grep -Fq 'create table if not exists public.contract_confirmations' "$migration"
          grep -Fq 'enable row level security' "$migration"
          grep -Fq 'revoke all on table public.contract_confirmations from public, anon, authenticated' "$migration"
          grep -Fq 'contract_confirmations_user_league_contract_unique' "$migration"
          grep -Fq 'finalize-consumer-registration' "$client"
          grep -Fq 'confirmation?.sent_at' "$client"
          if grep -Fq ".rpc('create_league'" "$client"; then
            echo 'Registration client bypasses contract finalization.' >&2
            exit 1
          fi
          grep -Fq 'userClient.auth.getUser()' "$function"
          grep -Fq 'actor.email_confirmed_at' "$function"
          grep -Fq 'registration_metadata_mismatch' "$function"
          grep -Fq 'userClient.rpc("create_league"' "$function"
          grep -Fq 'contract_confirmations' "$function"
          grep -Fq 'confirmation_sent_at' "$function"
          grep -Fq 'RESEND_API_KEY' "$function"
          grep -Fq 'Muster-Widerrufsformular' "$function"
          grep -Fq '0,00 EUR' "$function"
          echo 'Contract confirmation smoke passed.'
