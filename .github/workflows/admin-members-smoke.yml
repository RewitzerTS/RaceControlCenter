name: Admin Member Invite Smoke

on:
  pull_request:
    paths:
      - 'admin.html'
      - 'assets/js/pages/admin-members.js'
      - 'supabase/functions/manage-league-member/index.ts'
      - '.github/workflows/admin-members-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-member-invite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify member management wiring and navigation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'assets/js/pages/admin-members.js' admin.html
          grep -Fq 'RCCLeagueMembers?.init?.()' admin.html
          grep -Fq 'Person hinzufügen / einladen' assets/js/pages/admin-members.js
          grep -Fq "functions.invoke('manage-league-member'" assets/js/pages/admin-members.js
          grep -Fq "action:'check'" assets/js/pages/admin-members.js
          grep -Fq 'Diese E-Mail besitzt bereits ein gültiges RaceVora Konto.' assets/js/pages/admin-members.js
          grep -Fq 'accountExists' supabase/functions/manage-league-member/index.ts
          grep -Fq 'alreadyMember' supabase/functions/manage-league-member/index.ts
          grep -Fq 'action === "check"' supabase/functions/manage-league-member/index.ts
          grep -Fq "button.textContent='Team'" assets/js/pages/admin-members.js
          grep -Fq "button.dataset.adminTabTarget='admin-section-members'" assets/js/pages/admin-members.js
          grep -Fq "setMemberPanelVisible(memberPanel,showMembers)" assets/js/pages/admin-members.js
          grep -Fq "style.setProperty('display',visible?'block':'none','important')" assets/js/pages/admin-members.js
          node --check assets/js/pages/admin-members.js
