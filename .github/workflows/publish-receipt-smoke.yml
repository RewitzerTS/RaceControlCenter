name: Publish Receipt Smoke

on:
  pull_request:
    paths:
      - 'assets/js/components/rcc-result-release.js'
      - '.github/workflows/publish-receipt-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/components/rcc-result-release.js'
      - '.github/workflows/publish-receipt-smoke.yml'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate publish receipt wiring
        run: |
          node --check assets/js/components/rcc-result-release.js
          grep -Fq 'renderPublishReceipt' assets/js/components/rcc-result-release.js
          grep -Fq 'Öffentliches Rennen öffnen' assets/js/components/rcc-result-release.js
          grep -Fq 'Fahrer-WM öffnen' assets/js/components/rcc-result-release.js
          grep -Fq 'Team-WM öffnen' assets/js/components/rcc-result-release.js
          grep -Fq 'round_number' assets/js/components/rcc-result-release.js
          grep -Fq 'season_id' assets/js/components/rcc-result-release.js
