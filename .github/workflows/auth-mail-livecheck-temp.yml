name: Auth Mail Livecheck TEMP

on:
  push:
    branches:
      - feature/auth-mail-livecheck

permissions:
  contents: read

jobs:
  auth-mail-livecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger signup and recovery mails
        shell: bash
        env:
          SUPABASE_URL: https://kjccstcbqygxuqkvdaqw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_UcBMe7zBdjjBWsO42znXGQ_kGpEnKo7
          TEST_EMAIL: support@racevora.com
        run: |
          set -euo pipefail
          password="RvTemp!$(openssl rand -hex 16)Aa1"

          signup_status="$(curl --silent --show-error --output signup.json --write-out '%{http_code}' \
            --request POST \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${TEST_EMAIL}\",\"password\":\"${password}\"}" \
            "${SUPABASE_URL}/auth/v1/signup?redirect_to=https%3A%2F%2Fracevora.com%2Fset-password.html")"

          echo "Signup HTTP ${signup_status}"
          cat signup.json
          test "${signup_status}" = "200"

          recovery_status="$(curl --silent --show-error --output recovery.json --write-out '%{http_code}' \
            --request POST \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${TEST_EMAIL}\"}" \
            "${SUPABASE_URL}/auth/v1/recover?redirect_to=https%3A%2F%2Fracevora.com%2Fset-password.html")"

          echo "Recovery HTTP ${recovery_status}"
          cat recovery.json
          test "${recovery_status}" = "200"
