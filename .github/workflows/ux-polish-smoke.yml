name: UX Polish Smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/js/pages/landing.js'
      - 'test-landing/index.html'
      - 'test-landing/style.css'
      - 'test-landing/script.js'
      - '.github/workflows/ux-polish-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-ux-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser JavaScript
        run: |
          node --check assets/js/pages/landing.js
          node --check test-landing/script.js
      - name: Verify cinematic landing sources
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'test-landing/racevora-master-mobile.mp4' index.html
          grep -Fq 'test-landing/racevora-poster.webp' index.html
          grep -Fq 'class="command-shell"' index.html
          grep -Fq 'data-login-open' index.html
          grep -Fq 'landing-login-form' index.html
          test -f test-landing/racevora-master-mobile.mp4
          test -f test-landing/racevora-poster.webp
          test "$(find test-landing/frames -maxdepth 1 -name 'frame-*.webp' | wc -l)" -eq 90
          if grep -Eq '<iframe[^>]+src="(race-hub|fahrer-wm|ergebnisse|admin|stewards)\.html' index.html; then
            echo 'Decorative landing preview unexpectedly loads a live application page.' >&2
            exit 1
          fi

  landing-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/racevora-ux-http.log 2>&1 &
          echo $! > /tmp/racevora-ux-http.pid
      - name: Verify responsive landing on common devices
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              ['desktop-1440', 1440, 900],
              ['laptop-1280', 1280, 800],
              ['tablet-1024', 1024, 1366],
              ['tablet-768', 768, 1024],
              ['iphone', 390, 844],
              ['small-phone', 360, 800]
            ];
            for (const [name, width, height] of cases) {
              const page = await browser.newPage({ viewport: { width, height } });
              const errors = [];
              page.on('pageerror', error => {
                const text = String(error?.message || error);
                if (!/supabase|turnstile/i.test(text)) errors.push(text);
              });
              const response = await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
              if (!response || response.status() >= 400) throw new Error(`${name}: HTTP ${response?.status()}`);
              await page.waitForSelector('.cinematic-story');
              await page.waitForTimeout(450);
              const state = await page.evaluate(() => ({
                revision: document.body.dataset.landingRevision,
                overflow: document.documentElement.scrollWidth - window.innerWidth,
                heroWidth: document.querySelector('.cinematic-story h1')?.getBoundingClientRect().width || 0,
                viewport: window.innerWidth,
                cinematicMedia: document.querySelectorAll('.cinematic-story canvas,.cinematic-story video,.cinematic-story .motion-poster').length,
                loginButtons: [...document.querySelectorAll('[data-login-open]')].filter(el => !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length)).length,
                legacyCss: [...document.styleSheets].some(sheet => String(sheet.href || '').includes('landing3'))
              }));
              if (state.revision !== 'cinematic-v2-2026-08-19') throw new Error(`${name}: wrong landing revision ${state.revision}`);
              if (state.overflow > 2) throw new Error(`${name}: horizontal overflow ${state.overflow}px`);
              if (state.heroWidth > state.viewport + 2) throw new Error(`${name}: hero heading exceeds viewport`);
              if (state.cinematicMedia < 3) throw new Error(`${name}: cinematic media layers missing`);
              if (state.loginButtons < 1) throw new Error(`${name}: visible login button missing`);
              if (state.legacyCss) throw new Error(`${name}: legacy landing3 stylesheet still loaded`);
              if (errors.length) throw new Error(`${name}: ${errors.join(' | ')}`);
              await page.close();
            }

            const login = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await login.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
            await login.locator('[data-login-open]:visible').first().click();
            await login.waitForSelector('#landing-login-modal:not([hidden])');
            const dialog = await login.locator('.login-modal__dialog').evaluate(el => ({
              width: el.getBoundingClientRect().width,
              viewport: window.innerWidth,
              overflow: document.documentElement.scrollWidth - window.innerWidth
            }));
            if (dialog.width > dialog.viewport) throw new Error('Mobile login modal exceeds viewport.');
            if (dialog.overflow > 2) throw new Error(`Mobile login creates ${dialog.overflow}px horizontal overflow.`);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
