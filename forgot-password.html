<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>RaceVora · Passwort zurücksetzen</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/racevora-mark.svg">
  <link rel="stylesheet" href="assets/css/pages/register.css">
</head>
<body class="register-page">
  <main class="register-shell">
    <section class="register-card" aria-labelledby="recovery-title">
      <a href="index.html" class="register-brand" aria-label="Zur RaceVora Startseite">
        <img src="assets/images/racevora-mark.svg" alt="" width="72" height="72">
        <div><strong>RaceVora</strong><span>Race Management Platform</span></div>
      </a>
      <div class="register-heading">
        <span class="register-kicker">ACCOUNT</span>
        <h1 id="recovery-title">Passwort zurücksetzen</h1>
        <p>Gib die E-Mail-Adresse deines RaceVora-Accounts ein. Du erhältst anschließend einen sicheren Link zum Festlegen eines neuen Passworts.</p>
      </div>
      <form id="password-recovery-form" class="register-form">
        <label class="register-field">
          <span>E-Mail-Adresse</span>
          <input id="password-recovery-email" type="email" autocomplete="email" required placeholder="name@beispiel.de">
        </label>
        <button id="password-recovery-submit" class="register-submit" type="submit">Reset-Link senden</button>
      </form>
      <div id="password-recovery-feedback" class="register-feedback" role="status" aria-live="polite" hidden></div>
      <p class="register-login-link"><a href="index.html">Zurück zum Login</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-turnstile-config.js"></script>
  <script src="assets/js/auth-turnstile.js"></script>
  <script src="assets/js/email-pause.js"></script>
  <script src="assets/js/pages/forgot-password.js"></script>
</body>
</html>
