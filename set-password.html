<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RaceVora · Passwort festlegen</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/racevora-logo-color.svg">
  <meta name="theme-color" content="#0B0F1A">
</head>
<body>
  <main class="section">
    <div class="container section-header">
      <div>
        <div class="eyebrow">RaceVora</div>
        <h1 class="page-title page-title-compact">Passwort festlegen</h1>
      </div>
    </div>

    <div class="container admin-layout">
      <section class="panel admin-panel-accent">
        <h3>Deinen Account aktivieren</h3>
        <div class="notice" id="password-setup-status">Einladung wird geprüft...</div>
        <div id="password-setup-form" hidden>
          <div class="form-grid section-spacer-top">
            <div class="field">
              <label for="new-password">Neues Passwort</label>
              <input id="new-password" type="password" autocomplete="new-password" minlength="10" placeholder="Mindestens 10 Zeichen">
            </div>
            <div class="field">
              <label for="confirm-password">Passwort wiederholen</label>
              <input id="confirm-password" type="password" autocomplete="new-password" minlength="10" placeholder="Passwort wiederholen">
            </div>
          </div>
          <div class="card-actions">
            <button type="button" class="button-primary" id="save-password-btn">Passwort speichern</button>
          </div>
          <div class="notice" id="password-setup-feedback" hidden></div>
        </div>
      </section>
    </div>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/supabase-client.js"></script>
  <script defer src="assets/js/pages/set-password.js"></script>
</body>
</html>
